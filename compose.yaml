services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: pianomapper
      POSTGRES_USER: pianomapper
      POSTGRES_PASSWORD: pianomapper
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - pianomapper-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --username pianomapper --dbname pianomapper"]
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  pianomapper-postgres-data:
